name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=test-artifacts/junit.xml
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-node-${{ matrix.node }}
          path: test-artifacts/junit.xml
          retention-days: 14
          if-no-files-found: warn
      - name: Upload coverage
        if: ${{ always() && matrix.node == 22 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node-22
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          retention-days: 14
          if-no-files-found: warn

  desktop-build:
    name: desktop-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify JEA Home paths and migration
        run: npm test -- --run test/jea-home.test.mjs test/jea-home-migration.test.mjs
      - run: npm run desktop:test
      - run: npm test -- --run test/acp-posix-process-tree.test.mjs
      - run: npm run desktop:typecheck
      - run: npm run desktop:build
      - run: xvfb-run -a npm run desktop:smoke
      - name: Upload desktop smoke
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-linux
          path: test-artifacts/desktop-smoke-*.json
          retention-days: 14
          if-no-files-found: warn

  desktop-platform:
    name: desktop-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify JEA Home paths and migration
        run: npm test -- --run test/jea-home.test.mjs test/jea-home-migration.test.mjs
      - run: npm run desktop:test
      - name: Verify Windows ACP process-tree cleanup
        if: runner.os == 'Windows'
        run: npm test -- --run test/acp-windows-process-tree.test.mjs
      - name: Verify POSIX ACP process-tree cleanup
        if: runner.os != 'Windows'
        run: npm test -- --run test/acp-posix-process-tree.test.mjs
      - run: npm run desktop:typecheck
      - run: npm run desktop:build
      - run: npm run desktop:smoke
      - name: Upload desktop smoke
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-${{ runner.os }}
          path: test-artifacts/desktop-smoke-*.json
          retention-days: 14
          if-no-files-found: warn

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:ci
