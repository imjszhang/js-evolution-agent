name: Nightly

on:
  schedule:
    - cron: '27 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reactor-canary:
    name: reactor-canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run mock reactor canary
        env:
          JEA_FORCE_MOCK: '1'
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          # Nightly is mock-only: do not inject DEEPSEEK_API_KEY or run live model tests.
          unset DEEPSEEK_API_KEY || true
          npm run reactor:canary 2>&1 | tee test-artifacts/reactor-canary.log
      - name: Upload canary log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reactor-canary-log
          path: test-artifacts/reactor-canary.log
          retention-days: 14
          if-no-files-found: warn
