# Attach an already-built official artifact to an existing GitHub Release.
# This is not a publisher: it does not create a tag or Release.
# Use this instead of downloading the artifact to a local machine.
name: Attach Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub Release tag (must already exist)'
        type: string
        default: 'v0.3.1'
      run_id:
        description: 'Successful macOS Release run that produced the artifact'
        type: string
        required: true
      artifact_name:
        description: 'Artifact name to attach'
        type: string
        default: 'macos-release-0.3.1'
      replace_existing_assets:
        description: 'Explicitly replace conflicting asset names (default fail-closed)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

env:
  JEA_CONTRACT_MODE: strict

concurrency:
  group: attach-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  attach:
    name: attach-existing-release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate dispatch inputs
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must look like v0.2.0"
            exit 1
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "run_id must be digits"
            exit 1
          fi
          if [[ ! "$ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "artifact_name is not a safe identifier"
            exit 1
          fi
          if [ "$ARTIFACT_NAME" != "macos-release-${TAG#v}" ]; then
            echo "artifact_name must match the target tag version"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm ci

      - name: Require an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Verify source run and target tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          SOURCE_WORKFLOW="$(jq -r '.path // ""' <<<"$RUN_JSON")"
          SOURCE_CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RUN_JSON")"
          SOURCE_HEAD_SHA="$(jq -r '.head_sha // ""' <<<"$RUN_JSON")"
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')"
          if [ "$SOURCE_WORKFLOW" != ".github/workflows/release-macos.yml" ]; then
            echo "run_id must come from .github/workflows/release-macos.yml"
            exit 1
          fi
          if [ "$SOURCE_CONCLUSION" != "success" ]; then
            echo "source release-macos run must have conclusion=success"
            exit 1
          fi
          if [[ ! "$SOURCE_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [ "$SOURCE_HEAD_SHA" != "$TAG_SHA" ]; then
            echo "source run head_sha must exactly match the target tag commit"
            exit 1
          fi
          echo "TAG_SHA=$TAG_SHA" >> "$GITHUB_ENV"

      - name: Download the official artifact from the source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/jea-release-attach
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Validate allowlisted assets
        env:
          TAG: ${{ inputs.tag }}
          ARTIFACT_DIR: ${{ runner.temp }}/jea-release-attach
        run: |
          set -euo pipefail
          node scripts/release-attach-assets.mjs --dir "$ARTIFACT_DIR" --tag "$TAG" --expected-commit "$TAG_SHA" --json

      - name: Run publish guard before attachment
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/jea-release-attach
        run: npm run release:publish-guard -- --publish --evidence "$ARTIFACT_DIR" --json

      - name: Upload allowlisted files to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ARTIFACT_DIR: ${{ runner.temp }}/jea-release-attach
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(node scripts/release-attach-assets.mjs --dir "$ARTIFACT_DIR" --tag "$TAG" --expected-commit "$TAG_SHA" --print-paths)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No allowlisted files to upload."
            exit 1
          fi
          mapfile -t EXISTING_ASSETS < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          CONFLICTS=()
          for file in "${FILES[@]}"; do
            name="$(basename "$file")"
            for existing in "${EXISTING_ASSETS[@]}"; do
              if [ "$name" = "$existing" ]; then
                CONFLICTS+=("$name")
              fi
            done
          done
          UPLOAD_ARGS=()
          if [ "${#CONFLICTS[@]}" -gt 0 ]; then
            if [ "$REPLACE_EXISTING_ASSETS" != "true" ]; then
              printf 'Existing release assets conflict; refusing overwrite: %s\n' "${CONFLICTS[*]}"
              exit 1
            fi
            UPLOAD_ARGS+=(--clobber)
          fi
          gh release upload "$TAG" "${FILES[@]}" "${UPLOAD_ARGS[@]}" --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url,assets:[.assets[].name]}'
