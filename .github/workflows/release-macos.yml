# #122 certification workflow — still not the final GitHub Release publisher.
# Do not create a v0.1.0 tag or GitHub Release from this workflow.
name: macOS Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Request GitHub Release publication (always fail-closes without certified evidence)'
        type: boolean
        default: false
      soak:
        description: 'Run the release-only 30-minute packaged recovery soak (not a PR required check)'
        type: boolean
        default: false
      artifact_dir:
        description: 'Directory to smoke-check after packaging'
        type: string
        default: dist/release
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      soak:
        type: boolean
        default: false
      artifact_dir:
        type: string
        default: dist/release

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-preflight:
    name: certify-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version agreement (strict)
        run: npm run release:preflight -- --strict --json
      - name: Keep audit:ci on the certification path (#77)
        run: npm run release:audit-gate -- --json
      - name: Production dependency audit (do not replace ci-audit.mjs)
        run: npm run audit:ci
      - name: Scan committed fixtures
        run: npm run release:scan -- --root test/fixtures/release/clean --json
      - name: Publish guard (idle unless publish=true)
        run: npm run release:publish-guard -- --json

  macos-package:
    name: macos-package
    runs-on: macos-14
    timeout-minutes: 60
    needs: certify-preflight
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse secret and user-runtime uploads
        run: |
          set -euo pipefail
          if [ -e .env ] || [ -e .env.local ]; then
            echo "Refusing to continue while a checkout .env is present."
            exit 1
          fi
      - name: Build macOS arm64 artifacts
        run: npm run desktop:package
      - name: Package smoke
        env:
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        run: npm run release:package-smoke -- --dir "${ARTIFACT_DIR:-dist/release}" --json
      - name: Packaged recovery matrix
        env:
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        run: npm run release:recovery-matrix -- --packaged --app dist/release/build/mac-arm64/JEA.app --with-web --out "${ARTIFACT_DIR:-dist/release}" --json
      - name: Scan staged resources
        run: npm run release:scan -- --root dist/release/stage --json
      - name: Upload macOS artifacts (never .env, JEA Home, or runtime)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-0.1.0
          path: |
            dist/release/JEA-0.1.0-macos-arm64.dmg
            dist/release/JEA-0.1.0-macos-arm64.zip
            dist/release/SHA256SUMS
            dist/release/package-smoke.json
            dist/release/RELEASE_NOTES.md
            dist/release/recovery-matrix.json
            dist/release/certification-evidence.json
            dist/release/build-metadata.json
          retention-days: 14
          if-no-files-found: warn

  recovery-soak:
    name: recovery-soak (release-only, 30 min)
    runs-on: macos-14
    timeout-minutes: 90
    needs: macos-package
    if: ${{ inputs.soak }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build dir-only JEA.app for soak
        run: node --preserve-symlinks scripts/package-macos.mjs --dir-only --json
      - name: 30-minute packaged soak
        env:
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        run: |
          set -euo pipefail
          APP="dist/release/build/mac-arm64/JEA.app"
          if [ ! -d "$APP" ]; then
            echo "JEA.app is required for the release soak."
            exit 1
          fi
          npm run release:recovery-soak -- --packaged --app "$APP" --duration-ms 1800000 --out "${ARTIFACT_DIR:-dist/release}/soak-report.json" --json
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-recovery-soak-0.1.1
          path: |
            dist/release/soak-report.json
          retention-days: 14
          if-no-files-found: warn

  publish-guard:
    name: publish-guard (not a publisher)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: macos-package
    if: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail closed without certification evidence
        env:
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        run: |
          set -euo pipefail
          echo "This job is not allowed to tag v0.1.0 or create a GitHub Release."
          npm run release:publish-guard -- --publish --evidence "${ARTIFACT_DIR:-dist/release}" --json
          echo "Unreachable if the guard is working: publish must fail closed without certified evidence."
          exit 1
