# #122 certification workflow — still not the final GitHub Release publisher.
# Do not create a tag or GitHub Release from this workflow.
# To attach an already-built artifact to an existing Release, use release-attach-assets.yml.
name: macOS Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Request GitHub Release publication (always fail-closes without certified evidence)'
        type: boolean
        default: false
      artifact_dir:
        description: 'Directory to smoke-check after packaging'
        type: string
        default: dist/release
      release_version:
        description: 'Product version used for artifact names'
        type: string
        default: '0.3.0'
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      artifact_dir:
        type: string
        default: dist/release
      release_version:
        type: string
        default: '0.3.0'

permissions:
  contents: read

env:
  JEA_CONTRACT_MODE: strict

concurrency:
  group: release-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-preflight:
    name: certify-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version agreement (strict)
        run: npm run release:preflight -- --strict --json
      - name: Keep audit:ci on the certification path (#77)
        run: npm run release:audit-gate -- --json
      - name: Production dependency audit (do not replace ci-audit.mjs)
        run: npm run audit:ci
      - name: Scan committed fixtures
        run: npm run release:scan -- --root test/fixtures/release/clean --json
      - name: Isolated control-plane acceptance (temp JEA_HOME, mock)
        run: |
          set -euo pipefail
          mkdir -p dist/release
          npm run --silent audit:control-plane -- --json --size tiny --out dist/release/control-plane-audit.json
          node --input-type=module - dist/release/control-plane-audit.json <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (report.ok !== true || report.gate?.target_id !== '0.3.0-reactor-control-plane') {
            console.error('control-plane audit failed');
            process.exit(1);
          }
          NODE
      - name: Upload control-plane audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-plane-audit
          path: dist/release/control-plane-audit.json
          retention-days: 14
          if-no-files-found: error
      - name: Publish guard (idle unless publish=true)
        run: npm run release:publish-guard -- --json

  macos-package:
    name: macos-package
    runs-on: macos-14
    timeout-minutes: 90
    needs: certify-preflight
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse secret and user-runtime uploads
        run: |
          set -euo pipefail
          if [ -e .env ] || [ -e .env.local ]; then
            echo "Refusing to continue while a checkout .env is present."
            exit 1
          fi
      - name: Build macOS arm64 artifacts
        run: npm run desktop:package
      - name: Package smoke
        env:
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        run: npm run release:package-smoke -- --dir "${ARTIFACT_DIR:-dist/release}" --json
      - name: Packaged recovery matrix
        env:
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        run: npm run release:recovery-matrix -- --packaged --app dist/release/build/mac-arm64/JEA.app --with-web --out "${ARTIFACT_DIR:-dist/release}" --json
      - name: Isolated product journey (packaged CLI)
        env:
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        run: npm run release:journey -- --app dist/release/build/mac-arm64/JEA.app --json --out "${ARTIFACT_DIR:-dist/release}/product-journey.json"
      - name: Packaged launch smoke (not the 30-minute soak)
        env:
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        run: npm run release:recovery-soak -- --packaged --app dist/release/build/mac-arm64/JEA.app --duration-ms 15000 --sample-ms 3000 --out "${ARTIFACT_DIR:-dist/release}/launch-smoke.json" --json
      - name: Complete-loop closure audit against frozen target
        env:
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        run: |
          set -euo pipefail
          RELEASE_DIR="${ARTIFACT_DIR:-dist/release}"
          CLOSURE_HOME="$(mktemp -d)"
          RAW_REPORT="$RUNNER_TEMP/closure-audit-raw.json"
          trap 'rm -rf "$CLOSURE_HOME"' EXIT
          export JEA_HOME="$CLOSURE_HOME"
          npm run --silent jea -- subject init release-certification --use
          npm run --silent jea -- data init --all --subject release-certification
          npm run --silent jea -- run --mock --subject release-certification
          npm run --silent jea -- audit closure --subject release-certification --json > "$RAW_REPORT"
          node --input-type=module - "$RAW_REPORT" "$RELEASE_DIR/build-metadata.json" "$RELEASE_DIR/closure-audit.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const [rawPath, metadataPath, outPath] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(rawPath, 'utf8'));
          const metadata = JSON.parse(readFileSync(metadataPath, 'utf8'));
          Object.assign(report, {
            generated_at: new Date().toISOString(),
            build_id: metadata.build_id,
            commit: metadata.commit,
            dirty: metadata.dirty,
          });
          writeFileSync(outPath, `${JSON.stringify(report, null, 2)}\n`);
          NODE
      - name: 30-minute packaged soak (release-only)
        env:
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        run: npm run release:recovery-soak -- --packaged --app dist/release/build/mac-arm64/JEA.app --duration-ms 1800000 --out "${ARTIFACT_DIR:-dist/release}/soak-report.json" --json
      - name: Download Linux control-plane audit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: control-plane-audit
          path: ${{ inputs.artifact_dir || 'dist/release' }}
      # Linux audit has no packaged build_id. The evidence writer fills missing
      # identity from build-metadata.json and persists it before attach.
      - name: Write certification evidence from artifacts
        env:
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        run: npm run release:certification-evidence -- --dir "${ARTIFACT_DIR:-dist/release}" --json
      - name: Scan staged resources
        run: npm run release:scan -- --root dist/release/stage --json
      - name: Upload macOS artifacts (never .env, JEA Home, or runtime)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-${{ inputs.release_version }}
          path: |
            dist/release/JEA-${{ inputs.release_version }}-macos-arm64.dmg
            dist/release/JEA-${{ inputs.release_version }}-macos-arm64.zip
            dist/release/SHA256SUMS
            dist/release/package-smoke.json
            dist/release/RELEASE_NOTES.md
            dist/release/recovery-matrix.json
            dist/release/product-journey.json
            dist/release/launch-smoke.json
            dist/release/soak-report.json
            dist/release/closure-audit.json
            dist/release/control-plane-audit.json
            dist/release/certification-evidence.json
            dist/release/build-metadata.json
          retention-days: 14
          if-no-files-found: error

  publish-guard:
    name: publish-guard (not a publisher)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: macos-package
    if: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download final certification artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-release-${{ inputs.release_version }}
          path: ${{ runner.temp }}/jea-release-certification
      - name: Fail closed without certification evidence
        run: |
          set -euo pipefail
          echo "This job is not allowed to tag v${{ inputs.release_version }} or create a GitHub Release."
          npm run release:publish-guard -- --publish --evidence "${{ runner.temp }}/jea-release-certification" --json
