# Linux CI for the #122 release skeleton.
# Runs inventory/scan scripts against committed fixtures only.
# Does not replace or weaken check / test / desktop-build / dependency-audit / CodeQL.
name: Release skeleton

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: release-skeleton-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-skeleton:
    name: release-skeleton
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fixture inventory, version preflight, #77 wiring, publish guard
        run: npm run release:skeleton -- --json
      - name: Unit tests for release-skeleton scripts
        run: npm test -- --run test/release-skeleton.test.mjs test/release-product-journey.test.mjs
