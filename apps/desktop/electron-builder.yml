appId: com.imjszhang.jea
productName: JEA
copyright: Copyright © 2026 JEA
asar: false
npmRebuild: false
electronVersion: 43.4.0
electronDist: ../../node_modules/electron/dist
directories:
  output: ../../dist/release/build
  buildResources: resources
extraMetadata:
  name: jea
  version: 0.2.0
  description: JEA 0.2.0
  author: JEA
  main: apps/desktop/out/main/index.js
files:
  - from: ../../dist/release/stage/jea
    to: .
mac:
  target:
    - target: zip
      arch:
        - arm64
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  minimumSystemVersion: '13.0'
  artifactName: JEA-${version}-macos-${arch}.${ext}
dmg:
  artifactName: JEA-${version}-macos-${arch}.${ext}
extraResources:
  - from: ../../dist/release/stage/resources
    to: .
