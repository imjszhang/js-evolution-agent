<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evolution Viewer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Evolution Viewer</h1>
    <div id="subject-overview" class="subject-overview hidden" aria-label="Daemon 总览"></div>
    <div id="daemon-bar" class="daemon-bar hidden" aria-live="polite"></div>
    <div id="attention-panel" class="attention-panel hidden" aria-live="polite" aria-label="待关注事项"></div>
    <p id="meta" class="meta"></p>
    <p id="live-status" class="live-status" aria-live="polite"></p>
    <input type="search" id="filter" placeholder="筛选 cycle_id 或摘要…" autocomplete="off" />
  </header>
  <div class="layout">
    <aside class="sidebar-wrap">
      <div class="sidebar-section">
        <h2 class="sidebar-heading">进行中</h2>
        <div id="active-cycles" class="active-cycles" aria-label="进行中的 cycle"></div>
      </div>
      <div class="sidebar-section channel-section">
        <h2 class="sidebar-heading">Channel</h2>
        <div id="channel-panel" class="channel-panel" aria-live="polite" aria-label="Channel 运行态"></div>
      </div>
      <div class="sidebar-section sidebar-section-grow">
        <h2 class="sidebar-heading">已完成轮次</h2>
        <div class="sidebar" id="timeline" aria-label="演化轮次"></div>
      </div>
      <div class="sidebar-section event-feed-section">
        <h2 class="sidebar-heading">Daemon 事件</h2>
        <div id="event-feed" class="event-feed" aria-live="polite"></div>
      </div>
    </aside>
    <main class="detail" id="detail">
      <p class="placeholder">从左侧选择一轮或进行中的 cycle，或打开带 <code>#cycle-…</code> 的链接。</p>
    </main>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
