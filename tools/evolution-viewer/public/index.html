<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evolution Viewer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-view="ops">
  <header class="topbar">
    <div class="topbar-row">
      <div class="topbar-brand">
        <h1 data-i18n="app.title">Evolution Viewer</h1>
        <p id="live-status" class="live-status" aria-live="polite"></p>
      </div>
      <div id="subject-overview" class="subject-overview hidden" data-i18n-aria="kpi.channel"></div>
      <div id="locale-switch" class="locale-switch" role="group" data-i18n-aria="locale.switchLabel"></div>
    </div>
    <p id="meta" class="meta"></p>
  </header>
  <div class="layout" id="app-layout">
    <aside class="sidebar-wrap" data-i18n-aria="nav.navAriaLabel">
      <div class="sidebar-section">
        <h2 class="sidebar-heading" data-i18n="nav.inProgress">进行中</h2>
        <div id="active-cycles" class="active-cycles" data-i18n-aria="nav.inProgress"></div>
      </div>
      <div class="sidebar-section sidebar-section-grow">
        <div class="sidebar-heading-row">
          <h2 class="sidebar-heading" data-i18n="nav.history">历史轮次</h2>
          <input type="search" id="filter" class="sidebar-filter" data-i18n-placeholder="nav.filterPlaceholder" autocomplete="off" data-i18n-aria="nav.history" />
        </div>
        <div class="sidebar" id="timeline" data-i18n-aria="nav.history"></div>
      </div>
    </aside>
    <div class="main-stage">
      <main id="ops-home" class="ops-home" data-i18n-aria="app.opsTitle"></main>
      <main id="cycle-reader" class="cycle-reader hidden" data-i18n-aria="detail.reportTitle">
        <header class="reader-nav">
          <div class="reader-nav-start">
            <button type="button" id="back-to-ops" class="reader-back-btn" data-i18n-aria="nav.backToOps">
              <span class="reader-back-icon" aria-hidden="true">←</span>
              <span data-i18n="nav.opsHome">运维总览</span>
            </button>
            <span class="reader-nav-sep" aria-hidden="true">/</span>
            <span id="reader-nav-cycle" class="reader-nav-cycle"></span>
          </div>
          <span id="reader-nav-meta" class="reader-nav-meta hidden"></span>
        </header>
        <div id="detail" class="detail-inner"></div>
      </main>
    </div>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
