<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evolution Viewer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-view="ops">
  <header class="topbar">
    <div class="topbar-row">
      <div class="topbar-brand">
        <h1>Evolution Viewer</h1>
        <p id="live-status" class="live-status" aria-live="polite"></p>
      </div>
    </div>
    <div id="subject-overview" class="subject-overview hidden" aria-label="Subject 切换"></div>
    <p id="meta" class="meta"></p>
  </header>
  <div class="layout" id="app-layout">
    <aside class="sidebar-wrap" aria-label="导航">
      <div class="sidebar-section">
        <h2 class="sidebar-heading">进行中</h2>
        <div id="active-cycles" class="active-cycles" aria-label="进行中的 cycle"></div>
      </div>
      <div class="sidebar-section sidebar-section-grow">
        <div class="sidebar-heading-row">
          <h2 class="sidebar-heading">历史轮次</h2>
          <input type="search" id="filter" class="sidebar-filter" placeholder="筛选…" autocomplete="off" aria-label="筛选 cycle" />
        </div>
        <div class="sidebar" id="timeline" aria-label="演化轮次"></div>
      </div>
    </aside>
    <div class="main-stage">
      <main id="ops-home" class="ops-home" aria-label="运维总览"></main>
      <main id="cycle-reader" class="cycle-reader hidden" aria-label="轮次阅读">
        <header class="reader-nav">
          <div class="reader-nav-start">
            <button type="button" id="back-to-ops" class="reader-back-btn" aria-label="返回运维总览">
              <span class="reader-back-icon" aria-hidden="true">←</span>
              <span>运维总览</span>
            </button>
            <span class="reader-nav-sep" aria-hidden="true">/</span>
            <span id="reader-nav-cycle" class="reader-nav-cycle"></span>
          </div>
          <span id="reader-nav-meta" class="reader-nav-meta hidden"></span>
        </header>
        <div id="detail" class="detail-inner"></div>
      </main>
    </div>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
